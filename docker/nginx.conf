map_hash_bucket_size 128;
map_hash_max_size 32768;

map $uri $requested_apartment_code {
    default "";
    ~^/apartments/[^/]+-(?<captured_apartment_code>[a-z][a-z0-9]+)/?$ $captured_apartment_code;
}

map $requested_apartment_code $canonical_apartment_path {
    default "";
    include /etc/nginx/apartment-redirects.map;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;
    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = /api/health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location ~ ^/(posts|tags)(/|$) {
        include /etc/nginx/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        default_type text/plain;
        return 410 "Gone\n";
    }

    location ^~ /apartments/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=604800" always;
        try_files $uri $uri/ $uri/index.html @apartment_missing;
    }

    location @apartment_missing {
        include /etc/nginx/security-headers.conf;
        if ($canonical_apartment_path != "") {
            return 308 https://danjipyo.kr$canonical_apartment_path;
        }
        return 404;
    }

    location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?)$ {
        expires 30d;
        try_files $uri =404;
    }

    location ~* \.(?:xml|txt|json)$ {
        expires 1h;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
