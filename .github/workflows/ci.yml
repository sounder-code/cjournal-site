name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run test:regressions
      - run: npm run quality:urls
        env:
          PUBLICATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm run typecheck
      - run: npm run build
      - run: npm run quality:apartments
      - run: npm run quality:seo

      - name: Build production Docker image
        run: docker build --target production -t cjournal-site:ci .
